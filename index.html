<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аккаунты для отписки</title>
<style>
  :root{
    --bg:#0f0f14;
    --card:#1a1a22;
    --card-hover:#22222c;
    --card-done:#141a14;
    --text:#eaeaf0;
    --muted:#8a8a99;
    --accent:#e1306c;
    --accent-hover:#c9255c;
    --green:#2ecc71;
    --green-dim:#1e7a44;
    --border:#2a2a35;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px 16px 80px;
  }
  h1{font-size:20px;margin:0 0 6px;text-align:center}
  .count{text-align:center;color:var(--muted);font-size:14px;margin-bottom:14px}

  /* Прогресс */
  .progress-wrap{
    max-width:720px;margin:0 auto 18px;
    background:var(--card);border-radius:12px;padding:14px 16px;
    border:1px solid var(--border);
  }
  .progress-top{
    display:flex;justify-content:space-between;align-items:center;
    font-size:14px;margin-bottom:8px;
  }
  .progress-top b{color:var(--green)}
  .bar{
    height:8px;background:#2a2a35;border-radius:6px;overflow:hidden;
  }
  .bar-fill{
    height:100%;width:0;background:linear-gradient(90deg,var(--green-dim),var(--green));
    transition:width .25s ease;
  }

  /* Тулбар */
  .toolbar{
    max-width:720px;margin:0 auto 18px;
    display:flex;gap:10px;flex-wrap:wrap;
  }
  .toolbar input{
    flex:1;min-width:180px;
    padding:10px 14px;border-radius:10px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:14px;outline:none;
  }
  .toolbar input:focus{border-color:var(--accent)}
  .toolbar button{
    padding:10px 14px;border-radius:10px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:13px;cursor:pointer;
    transition:background .15s ease;
  }
  .toolbar button:hover{background:var(--card-hover)}
  .toolbar button.active{border-color:var(--accent);color:var(--accent)}

  /* Список */
  .list{
    max-width:720px;margin:0 auto;
    display:flex;flex-direction:column;gap:8px;
  }
  .row{
    display:flex;align-items:center;gap:10px;
    background:var(--card);padding:10px 12px;border-radius:12px;
    transition:background .15s ease;
  }
  .row:hover{background:var(--card-hover)}
  .row.done{background:var(--card-done);opacity:.6}
  .row.done .name{text-decoration:line-through;color:var(--muted)}

  .row .num{
    color:var(--muted);font-size:12px;width:28px;text-align:right;flex-shrink:0;
  }
  .row input[type="checkbox"]{
    width:18px;height:18px;accent-color:var(--green);cursor:pointer;flex-shrink:0;
  }
  .row .name{
    flex:1;font-size:14px;word-break:break-all;cursor:pointer;
  }
  .row .date{
    color:var(--muted);font-size:11px;white-space:nowrap;flex-shrink:0;
  }
  .row .actions{
    display:flex;gap:6px;flex-shrink:0;
  }
  .row a.btn, .row button.btn{
    display:inline-block;padding:7px 12px;border-radius:8px;
    border:none;text-decoration:none;font-size:12px;font-weight:600;
    cursor:pointer;white-space:nowrap;transition:background .15s ease,transform .1s ease;
  }
  .row a.btn{
    background:var(--accent);color:#fff;
  }
  .row a.btn:hover{background:var(--accent-hover)}
  .row button.btn.unfollow{
    background:var(--accent);color:#fff;
  }
  .row button.btn.unfollow:hover{background:var(--accent-hover)}
  .row button.btn.done-btn{
    background:var(--green-dim);color:#fff;
  }
  .row button.btn.done-btn:hover{background:var(--green)}
  .row button.btn:active, .row a.btn:active{transform:scale(.96)}

  /* Мобилка */
  @media (max-width:520px){
    .row{flex-wrap:wrap}
    .row .date{display:none}
    .row .actions{margin-left:auto}
  }
</style>
</head>
<body>

<h1>Аккаунты для отписки</h1>
<div class="count" id="count"></div>

<div class="progress-wrap">
  <div class="progress-top">
    <span>Отписано: <b id="doneCount">0</b> / <span id="totalCount">0</span></span>
    <span id="percent">0%</span>
  </div>
  <div class="bar"><div class="bar-fill" id="barFill"></div></div>
</div>

<div class="toolbar">
  <input id="search" type="text" placeholder="Поиск по нику...">
  <button id="sortDate" class="active" title="Сначала те, на кого подписался позже всех">По дате подписки</button>
  <button id="sortAlpha" title="По алфавиту">А–Я</button>
  <button id="resetBtn" title="Сбросить все отметки">Сбросить отметки</button>
</div>

<div class="list" id="list"></div>

const filtered = accounts
  .filter(a => !followersSet.has(a.u))
  .sort((a, b) => b.t - a.t);

/* ============================================================
   Состояние и localStorage
   ============================================================ */
const LS_KEY = 'ig_unfollow_done_v1';
let doneSet = new Set();
try {
  const raw = localStorage.getItem(LS_KEY);
  if (raw) doneSet = new Set(JSON.parse(raw));
} catch(e) {}

function saveDone(){
  try { localStorage.setItem(LS_KEY, JSON.stringify([...doneSet])); } catch(e) {}
}

/* ============================================================
   Форматирование даты
   ============================================================ */
function fmtDate(ts){
  const d = new Date(ts * 1000);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  return `${dd}.${mm}.${yyyy}`;
}

/* ============================================================
   Рендер
   ============================================================ */
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');
const sortDateBtn = document.getElementById('sortDate');
const sortAlphaBtn = document.getElementById('sortAlpha');
const resetBtn = document.getElementById('resetBtn');
const doneCountEl = document.getElementById('doneCount');
const totalCountEl = document.getElementById('totalCount');
const percentEl = document.getElementById('percent');
const barFillEl = document.getElementById('barFill');

let sortMode = 'date'; // 'date' | 'alpha'
let currentSearch = '';

function updateProgress(){
  const total = filtered.length;
  const done = filtered.filter(a => doneSet.has(a.u)).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  doneCountEl.textContent = done;
  totalCountEl.textContent = total;
  percentEl.textContent = pct + '%';
  barFillEl.style.width = pct + '%';
}

function render(){
  const f = currentSearch.trim().toLowerCase();
  let arr = filtered.slice();
  if (f) arr = arr.filter(a => a.u.toLowerCase().includes(f));
  if (sortMode === 'alpha') arr.sort((a,b) => a.u.localeCompare(b.u));
  else arr.sort((a,b) => b.t - a.t);

  listEl.innerHTML = '';
  arr.forEach((acc, i) => {
    const isDone = doneSet.has(acc.u);
    const row = document.createElement('div');
    row.className = 'row' + (isDone ? ' done' : '');
    row.innerHTML = `
      <div class="num">${i + 1}</div>
      <input type="checkbox" ${isDone ? 'checked' : ''} data-u="${acc.u}">
      <div class="name" data-u="${acc.u}">@${acc.u}</div>
      <div class="date">${fmtDate(acc.t)}</div>
      <div class="actions">
        <button class="btn unfollow" data-u="${acc.u}">Отписаться</button>
      </div>
    `;
    listEl.appendChild(row);
  });

  countEl.textContent = `Всего в списке: ${filtered.length} · Показано: ${arr.length} · Отписано: ${filtered.filter(a=>doneSet.has(a.u)).length}`;
  updateProgress();
}

/* ============================================================
   Обработчики
   ============================================================ */
listEl.addEventListener('change', e => {
  if (e.target.type === 'checkbox'){
    const u = e.target.dataset.u;
    if (e.target.checked) doneSet.add(u); else doneSet.delete(u);
    saveDone();
    e.target.closest('.row').classList.toggle('done', e.target.checked);
    updateProgress();
    countEl.textContent = `Всего в списке: ${filtered.length} · Отписано: ${filtered.filter(a=>doneSet.has(a.u)).length}`;
  }
});

listEl.addEventListener('click', e => {
  // Клик по имени — открыть профиль
  if (e.target.classList.contains('name')){
    window.open(`https://www.instagram.com/${e.target.dataset.u}/`, '_blank', 'noopener');
    return;
  }
  // Клик по кнопке «Отписаться»
  if (e.target.classList.contains('unfollow')){
    const u = e.target.dataset.u;
    window.open(`https://www.instagram.com/${u}/`, '_blank', 'noopener');
    // Автоматически отмечаем как «отписан» (можно снять галочку вручную)
    doneSet.add(u);
    saveDone();
    const row = e.target.closest('.row');
    row.classList.add('done');
    row.querySelector('input[type="checkbox"]').checked = true;
    updateProgress();
    countEl.textContent = `Всего в списке: ${filtered.length} · Отписано: ${filtered.filter(a=>doneSet.has(a.u)).length}`;
  }
});

searchEl.addEventListener('input', e => {
  currentSearch = e.target.value;
  render();
});

sortDateBtn.addEventListener('click', () => {
  sortMode = 'date';
  sortDateBtn.classList.add('active');
  sortAlphaBtn.classList.remove('active');
  render();
});

sortAlphaBtn.addEventListener('click', () => {
  sortMode = 'alpha';
  sortAlphaBtn.classList.add('active');
  sortDateBtn.classList.remove('active');
  render();
});

resetBtn.addEventListener('click', () => {
  if (!confirm('Сбросить все отметки «отписано»?')) return;
  doneSet = new Set();
  saveDone();
  render();
});

render();
</script>
</body>
</html>
